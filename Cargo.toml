[package]
name = "pdf-redactor"
version = "0.1.0"
edition = "2024"
description = "Scripted search and replace for rendered text and hyperlink URLs in PDF files"

[[bin]]
name = "pdf-redactor"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4.5.54", features = ["derive"] }
anyhow = "1.0.100"
flate2 = "1.1.5"
regex = "1.12.2"
zopfli = "0.8.3"
md-5 = "0.10.6"
sha2 = "0.10.9"
aes = "0.8.4"
memchr = "2.7.6"

[profile.release]
opt-level = 3
